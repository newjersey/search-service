name: QASP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qasp:
    uses: newjersey/innovation-shared-actions/.github/workflows/qasp.yml@feat/qasp-shared-workflow
    secrets: inherit
    with:
      deployment-check-urls: |
        https://registry.npmjs.org/@newjersey/njwds
      system-diagram-location: "docs/architecture.md"
      node-version: ".nvmrc" # optional (default: .nvmrc)
      test-coverage-command: "npm run test:coverage" # optional (default: npm run test:coverage)
